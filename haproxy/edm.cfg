# EDM CICS stack HAProxy configuration
# TLS termination for BRICKS_TS 3270 (port 2300) and web3270 (port 9000)
# Certificates: managed by acme.sh or certbot, stored in /etc/haproxy/certs/

global
    log /dev/log local0
    maxconn 256
    tune.ssl.default-dh-param 2048

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# ── 3270 TLS frontend (external port 2323 -> internal 2300) ──────────
frontend edm_3270_tls
    bind *:2323 ssl crt /etc/haproxy/certs/edm.pem
    default_backend edm_3270_backend

backend edm_3270_backend
    server bricks 127.0.0.1:2300 check

# ── web3270 HTTPS frontend (external 443 -> internal 9000) ──────────
frontend edm_web3270_https
    bind *:443 ssl crt /etc/haproxy/certs/edm.pem
    default_backend edm_web3270_backend

backend edm_web3270_backend
    server bricks_web 127.0.0.1:9000 check
