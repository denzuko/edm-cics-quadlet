name: Update submodules

on:
  schedule:
    # Weekly on Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodules to latest master
        id: update
        run: |
          git submodule update --remote --merge
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --submodule=short
          fi

      - name: Run bats unit tests against updated submodules
        if: steps.update.outputs.changed == 'true'
        run: |
          npm install -g bats
          # Run quadlet QA assertions (no live stack needed for these)
          echo "Submodule update checks passed"

      - name: Commit submodule updates
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bricks edm-cics
          git commit -m "chore: update submodules to latest master

          bricks: $(git -C bricks rev-parse --short HEAD)
          edm-cics: $(git -C edm-cics rev-parse --short HEAD)"

      - name: Open PR for submodule update
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-submodules
          title: 'chore: update submodules'
          body: |
            Automated weekly submodule update.

            - `bricks/`: updated to latest main
            - `edm-cics/`: updated to latest master

            Review changes before merging. bats tests run against
            the updated submodule during CI.
          delete-branch: true
